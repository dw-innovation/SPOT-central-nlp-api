name: Build image

# Pull requests build the image without publishing it, so a change that does
# not build is caught before merging. Pushes to main and staging publish,
# tagged with the branch and with the commit they were built from, so a
# running container can be traced back to a commit — which was impossible
# while images were built on the server and named without a version.

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> is the immutable one to pin a deployment to;
          # main and staging move with their branch.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the layer cache in Actions rather than on the server, where
          # it had grown to 22 GB of an 80 GB volume.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
